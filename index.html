
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Masar | Password Reset</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0b1324;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 32px 24px;
      background: #172338;
      border: 1px solid #304057;
      border-radius: 20px;
    }
    h1 { text-align: center; margin-bottom: 8px; }
    .subtitle {
      color: #b5c4d5;
      text-align: center;
      margin-bottom: 30px;
    }
    label { display: block; margin: 18px 0 8px; }
    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #53647a;
      border-radius: 10px;
      background: #0b1324;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 16px;
      margin-top: 24px;
      border: 0;
      border-radius: 10px;
      background: #16a36d;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: 0.5; }
    #status {
      margin-top: 18px;
      text-align: center;
      line-height: 1.6;
    }
    .success { color: #6ee7a8; }
    .error { color: #ff9999; }
    .footer {
      margin-top: 30px;
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>MASAR</h1>
    <p class="subtitle">Secure Password Recovery</p>

    <form id="form" hidden>
      <label for="password">New Password</label>
      <input id="password" type="password"
             autocomplete="new-password"
             minlength="12" required>

      <label for="confirm">Confirm Password</label>
      <input id="confirm" type="password"
             autocomplete="new-password"
             minlength="12" required>

      <button id="submit" type="submit">
        Update Password
      </button>
    </form>

    <p id="status" role="status">
      Verifying recovery link...
    </p>

    <div class="footer">
      Masar Delivery Platform
    </div>
  </main>

<script>
"use strict";

const SUPABASE_URL =
  "https://afijvayzmxvslcyvhfjd.supabase.co";

const API_KEY =
  "sb_publishable_1nj6XMvYtFd00XirkLi8uQ_osCfjeAb";

const form = document.getElementById("form");
const statusBox = document.getElementById("status");
const submit = document.getElementById("submit");

let accessToken = null;

function message(text, type = "") {
  statusBox.textContent = text;
  statusBox.className = type;
}

async function api(path, method, token, body) {
  const headers = {
    "apikey": API_KEY,
    "Authorization": "Bearer " + token,
    "Cache-Control": "no-store"
  };

  if (body !== undefined) {
    headers["Content-Type"] = "application/json";
  }

  const response = await fetch(
    SUPABASE_URL + "/auth/v1" + path,
    {
      method,
      headers,
      body: body === undefined
        ? undefined
        : JSON.stringify(body),
      cache: "no-store",
      referrerPolicy: "no-referrer"
    }
  );

  if (!response.ok) {
    throw new Error("Request failed");
  }

  return response.json();
}

async function initialize() {
  const params = new URLSearchParams(
    window.location.hash.substring(1)
  );

  const token = params.get("access_token");
  const type = params.get("type");
  const error = params.get("error");

  // Remove recovery credentials from the address bar.
  history.replaceState(
    null,
    "",
    window.location.pathname
  );

  if (error || !token || type !== "recovery") {
    message(
      "Invalid or expired recovery link. " +
      "Please request a new password reset email.",
      "error"
    );
    return;
  }

  try {
    await api("/user", "GET", token);
    accessToken = token;
    form.hidden = false;
    message("Enter your new password below.");
  } catch {
    message(
      "Recovery session expired or is invalid. " +
      "Please request a new reset email.",
      "error"
    );
  }
}

form.addEventListener("submit", async (event) => {
  event.preventDefault();

  if (!accessToken) {
    message("Recovery session is unavailable.", "error");
    return;
  }

  const password =
    document.getElementById("password").value;
  const confirm =
    document.getElementById("confirm").value;

  if (password.length < 12) {
    message(
      "Password must contain at least 12 characters.",
      "error"
    );
    return;
  }

  if (password !== confirm) {
    message("Passwords do not match.", "error");
    return;
  }

  submit.disabled = true;
  message("Updating password...");

  try {
    await api("/user", "PUT", accessToken, {
      password
    });

    accessToken = null;
    document.getElementById("password").value = "";
    document.getElementById("confirm").value = "";
    form.hidden = true;

    message(
      "Password updated successfully. " +
      "You can now sign in to Masar.",
      "success"
    );
  } catch {
    message(
      "Password update failed. " +
      "Please request a new recovery link.",
      "error"
    );
    submit.disabled = false;
  }
});

initialize();
</script>
</body>
</html>
